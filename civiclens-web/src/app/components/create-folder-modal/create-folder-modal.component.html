<div class="min-h-screen w-full flex items-center justify-center px-4 py-6">
  <div class="w-full max-w-md">
     <!-- Logo -->
      <div class="flex justify-center mb-5">
        <img src="/logo.png" alt="PlainView Logo" class="w-40 h-auto" />
      </div>
    <!-- Card -->
    <div
      class="relative overflow-hidden rounded-2xl bg-white border border-gray-200 shadow-[0_18px_45px_rgba(0,0,0,0.08)]"
    >
      <!-- Kenya color accent -->
      <div class="h-1 flex">
        <span class="flex-1 bg-[#000000]"></span>
        <span class="flex-1 bg-[#BB1E10]"></span>
        <span class="flex-1 bg-[#006600]"></span>
      </div>

      <div class="p-6">
        <!-- Header -->
        <div class="flex items-center gap-3 mb-6">
          <div
            class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-[#000000] text-white shadow-sm"
          >
            <!-- Folder icon -->
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-5 w-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M3 7.5A2.5 2.5 0 015.5 5H10l2 2h6.5A2.5 2.5 0 0121 9.5v8A2.5 2.5 0 0118.5 20h-13A2.5 2.5 0 013 17.5v-10z"
              />
            </svg>
          </div>

          <div>
            <div
              class="flex items-center gap-1.5 text-[10px] uppercase tracking-[0.16em] text-[#006600] font-bold montserrat-bold"
            >
              <span class="h-1.5 w-1.5 rounded-full bg-[#006600]"></span>

              Documents
            </div>

            <h2 class="mt-0.5 text-xl font-bold tracking-tight text-[#000000] playfair-bold">
              Create Folder
            </h2>
          </div>
        </div>

        <!-- Form -->
        <form class="space-y-4" (submit)="createDocumentFolder(); $event.preventDefault()">
          <!-- Name -->
          <div>
            <label
              for="folder-name"
              class="block text-xs font-semibold text-gray-700 mb-1.5 montserrat-semibold"
            >
              Folder name
            </label>

            <div
              class="group relative rounded-xl border border-gray-200 bg-gray-50 transition-all duration-200 focus-within:bg-white focus-within:border-[#006600] focus-within:ring-3 focus-within:ring-[#006600]/10"
            >
              <div
                class="absolute left-0 top-3 bottom-3 w-0.5 rounded-r-full bg-[#006600] opacity-0 transition-opacity group-focus-within:opacity-100"
              ></div>

              <input
                id="folder-name"
                type="text"
                autocomplete="off"
                placeholder="e.g. Customer Documents"
                [formField]="folderForm.name"
                class="w-full bg-transparent border-0 outline-none px-3.5 py-3 text-sm text-gray-900 placeholder:text-gray-400 montserrat-regular"
              />
            </div>

            @if (folderForm.name().touched() && folderForm.name().invalid()) {
              <div class="mt-1.5">
                @for (error of folderForm.name().errors(); track error.kind) {
                  <p class="text-[11px] text-[#BB1E10] montserrat-regular">
                    {{ error.message }}
                  </p>
                }
              </div>
            }
          </div>

          <!-- Preview -->
          <div
            class="flex items-center gap-3 rounded-xl bg-gray-50 border border-gray-100 px-3 py-2.5"
          >
            <div
              class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-[#000000] text-white"
            >
              <!-- Folder icon -->
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-4 w-4"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M3 7.5A2.5 2.5 0 015.5 5H10l2 2h6.5A2.5 2.5 0 0121 9.5v8A2.5 2.5 0 0118.5 20h-13A2.5 2.5 0 013 17.5v-10z"
                />
              </svg>
            </div>

            <div class="min-w-0">
              <p class="text-[9px] uppercase tracking-wider text-gray-400 montserrat-bold">
                Preview
              </p>

              <p class="truncate text-xs font-semibold text-gray-800 montserrat-semibold">
                @if (folderModel().name.trim()) {
                  {{ folderModel().name.trim() }}
                } @else {
                  Your folder
                }
              </p>
            </div>

            <span
              class="ml-auto shrink-0 text-[9px] font-semibold text-[#006600] bg-[#006600]/10 px-2 py-1 rounded-full montserrat-semibold"
            >
              Ready
            </span>
          </div>

          <!-- Button -->
          <button
            type="submit"
            [disabled]="folderForm().invalid() || loading()"
            class="group w-full rounded-xl bg-[#BB1E10] hover:bg-[#9F190E] text-white py-3 text-sm font-semibold shadow-sm transition-all hover:-translate-y-0.5 hover:shadow-md active:translate-y-0 disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:translate-y-0 montserrat-semibold cursor-pointer"
          >
            @if (loading()) {
              <span class="flex items-center justify-center gap-2">
                <svg
                  class="h-4 w-4 animate-spin"
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                >
                  <circle
                    class="opacity-25"
                    cx="12"
                    cy="12"
                    r="10"
                    stroke="currentColor"
                    stroke-width="4"
                  />

                  <path
                    class="opacity-75"
                    fill="currentColor"
                    d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"
                  />
                </svg>

                Creating...
              </span>
            } @else {
              <span class="flex items-center justify-center gap-2">
                Create Folder

                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  class="h-4 w-4 transition-transform group-hover:translate-x-0.5"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14m-6-6 6 6-6 6" />
                </svg>
              </span>
            }
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
